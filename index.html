<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>চান্দা দে — Dhaka 3D</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
}

body {
  margin: 0;
  overflow: hidden;
  background: #b8cbd0;
  font-family: Arial, sans-serif;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.screen {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  color: white;
  background: linear-gradient(145deg, #111c25ee, #263943ee);
}

.panel {
  width: 100%;
  max-width: 430px;
  padding: 28px 20px;
  border: 1px solid #ffffff30;
  border-radius: 22px;
  background: #101820df;
  box-shadow: 0 15px 40px #0006;
}

h1 {
  color: #ffd54a;
  font-size: 48px;
  margin: 12px 0;
  text-shadow: 3px 4px #a93226;
}

button {
  padding: 13px 17px;
  border: 2px solid #ffd54a;
  border-radius: 13px;
  background: #18232c;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

.start {
  background: #ffd54a;
  color: #202830;
  font-size: 18px;
  margin-top: 18px;
}

.hidden {
  display: none !important;
}

#hud {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}

.topbar {
  display: flex;
  justify-content: space-between;
  padding: 15px;
  color: white;
  font-weight: bold;
  text-shadow: 1px 2px #000;
}

.stat {
  padding: 10px 13px;
  border-radius: 12px;
  background: #101820d9;
  border: 1px solid #ffffff40;
}

#score {
  color: #ffd54a;
}

.controls {
  position: absolute;
  bottom: 30px;
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  pointer-events: auto;
}

.controls button {
  min-height: 55px;
}

.collect {
  background: #159957;
  border-color: #69e6a2;
}

#message {
  text-align: center;
  color: white;
  font-weight: bold;
  margin-top: 10px;
  text-shadow: 1px 2px #000;
}

.ticker {
  position: fixed;
  z-index: 6;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 6px;
  text-align: center;
  background: #b83227;
  color: white;
  font-size: 12px;
}

@media(max-width:380px) {
  button {
    padding: 10px;
    font-size: 13px;
  }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="landing" class="screen">
  <div class="panel">
    <div> DHAKA STREET • 3D GAME </div>
    <h1>চান্দা দে</h1>
    <p>ঢাকার ব্যস্ত রাস্তায় নামার সময়!</p>
    <p>বাধা এড়িয়ে চলুন, টাকা সংগ্রহ করুন!</p>
    <button class="start" onclick="startGame()">
      ▶ খেলতে শুরু করুন
    </button>
  </div>
</div>

<div id="gameover" class="screen hidden">
  <div class="panel">
    <h1>খেলা শেষ!</h1>
    <p>তোমার মোট স্কোর</p>
    <h2 id="finalScore">০৳</h2>
    <button class="start" onclick="startGame()">আবার খেলুন</button>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="topbar">
    <div class="stat">সংগ্রহ: <span id="score">০</span>৳</div>
    <div class="stat">লাইফ: <span id="lives">❤️❤️❤️</span></div>
  </div>

  <div id="message">বাধা এড়িয়ে টাকা সংগ্রহ করুন!</div>

  <div class="controls">
    <div>
      <button onclick="movePlayer(-1)">◀ বামে</button>
      <button onclick="movePlayer(1)">ডানে ▶</button>
    </div>
    <button class="collect" onclick="collectCash()">💵 টাকা নিন</button>
  </div>
</div>

<div class="ticker">
  ঢাকা শহরের রাস্তায় সাবধানে চলুন!
</div>

<script>
let scene, camera, renderer, player;
let obstacles = [];
let cashItems = [];
let buildings = [];
let roadMarks = [];
let score = 0;
let lives = 3;
let running = false;
let lastTime = 0;
let spawnTimer = 0;
let cashTimer = 0;
let speed = 12;
let lane = 1;
let invincible = 0;

const lanes = [-3.2, 0, 3.2];

function mat(color, roughness = 0.85) {
  return new THREE.MeshStandardMaterial({
    color: color,
    roughness: roughness
  });
}

function addBox(parent, w, h, d, color, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    mat(color)
  );

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function createBuilding(x, z, side) {
  const group = new THREE.Group();

  const width = 5 + Math.random() * 2;
  const height = 8 + Math.random() * 10;
  const depth = 9 + Math.random() * 4;

  const colors = [
    0xc7b8a1, 0xb9c4c8, 0xd5c5b2,
    0x9faeb4, 0xd7d2c7
  ];

  const color = colors[
    Math.floor(Math.random() * colors.length)
  ];

  addBox(
    group, width, height, depth,
    color, 0, height / 2, 0
  );

  const front = side < 0 ? depth / 2 + 0.04 : -depth / 2 - 0.04;

  // জানালা
  for (let row = 0; row < Math.floor(height / 2); row++) {
    for (let col = 0; col < 3; col++) {
      const windowColor =
        Math.random() > 0.25 ? 0x42616d : 0xe5c878;

      addBox(
        group, 0.75, 0.9, 0.06,
        windowColor,
        (col - 1) * 1.4,
        1.5 + row * 1.8,
        front
      );
    }
  }

  // ছাদের কিনারা
  addBox(
    group, width + 0.3, 0.3, depth + 0.3,
    0x8b9698, 0, height + 0.1, 0
  );

  // বারান্দা
  for (let y = 3; y < height - 1; y += 3) {
    addBox(
      group, width * 0.7, 0.12, 0.6,
      0xb8b7ad, 0, y,
      front + (side < 0 ? 0.2 : -0.2)
    );
  }

  group.position.set(x, 0, z);
  scene.add(group);
  buildings.push(group);
}

function createTree(x, z) {
  const tree = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.2, 1.5, 8),
    mat(0x79543a)
  );
  trunk.position.y = 0.75;
  tree.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(0.9, 10, 8),
    mat(0x38764a)
  );
  leaves.position.y = 1.9;
  leaves.scale.set(1, 1.3, 1);
  tree.add(leaves);

  tree.position.set(x, 0, z);
  scene.add(tree);
  buildings.push(tree);
}

function createRoad() {
  addBox(scene, 10.8, 0.15, 160, 0x343a40, 0, -0.1, -45);

  // ফুটপাত
  for (const side of [-1, 1]) {
    addBox(scene, 2.5, 0.25, 160, 0xb8b4a8, side * 6.6, 0, -45);
    addBox(scene, 0.15, 0.3, 160, 0xe7d8a7, side * 5.35, 0, -45);
  }

  // রাস্তার দাগ
  for (let z = 15; z > -140; z -= 7) {
    for (const x of [-1.65, 1.65]) {
      const mark = addBox(
        scene, 0.1, 0.03, 3,
        0xf4d35e, x, 0, z
      );
      roadMarks.push(mark);
    }
  }
}

function createPlayer() {
  player = new THREE.Group();

  // পা
  addBox(player, 0.35, 0.65, 0.4, 0x202b36, -0.23, 0.4, 0);
  addBox(player, 0.35, 0.65, 0.4, 0x202b36, 0.23, 0.4, 0);

  // শরীর
  addBox(player, 1, 1, 0.55, 0x1e7a80, 0, 1.2, 0);

  // হাত
  addBox(player, 0.28, 0.85, 0.3, 0xd7a77d, -0.65, 1.2, 0);
  addBox(player, 0.28, 0.85, 0.3, 0xd7a77d, 0.65, 1.2, 0);

  // মাথা
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.34, 16, 12),
    mat(0xd9a47c)
  );
  head.position.y = 2.05;
  player.add(head);

  // চুল
  const hair = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 12, 8),
    mat(0x25201c)
  );
  hair.position.y = 2.16;
  player.add(hair);

  player.position.set(0, 0, 5);
  scene.add(player);
}

function createCar(z, carLane) {
  const car = new THREE.Group();

  const colors = [
    0x187a8c, 0xc83c35, 0xd5a62e,
    0xeeeeeb, 0x326b4c, 0x343b46
  ];

  const color = colors[Math.floor(Math.random() * colors.length)];

  addBox(car, 1.55, 0.65, 2.55, color, 0, 0.65, 0);
  addBox(car, 1.2, 0.6, 1.25, 0x9bc3cc, 0, 1.2, -0.1);
  addBox(car, 1.6, 0.15, 0.18, 0xadb5b8, 0, 0.4, 1.3);

  for (const x of [-0.55, 0.55]) {
    addBox(car, 0.2, 0.17, 0.06, 0xfff0bd, x, 0.75, 1.32);

    for (const zWheel of [-0.8, 0.8]) {
      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25, 0.25, 0.16, 12),
        mat(0x202326)
      );
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(x * 1.25, 0.3, zWheel);
      car.add(wheel);
    }
  }

  car.position.set(lanes[carLane], 0, z);
  scene.add(car);
  obstacles.push(car);
}

function createCash(z, cashLane) {
  const cash = new THREE.Group();

  addBox(cash, 0.75, 0.08, 0.45, 0x55d68b, 0, 0.9, 0);
  addBox(cash, 0.12, 0.09, 0.46, 0xd8ffe4, 0, 0.91, 0);

  cash.position.set(lanes[cashLane], 0, z);
  scene.add(cash);
  cashItems.push(cash);
}

function initGame() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xb8cbd0);
  scene.fog = new THREE.Fog(0xb8cbd0, 40, 130);

  camera = new THREE.PerspectiveCamera(
    52, innerWidth / innerHeight, 0.1, 300
  );
  camera.position.set(0, 10, 17);
  camera.lookAt(0, 1, -3);

  renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });

  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xe6f4ff, 0x68594b, 1.7));

  const sun = new THREE.DirectionalLight(0xffe0b1, 2);
  sun.position.set(-12, 25, 12);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  scene.add(sun);

  createRoad();

  for (let z = 15; z > -130; z -= 15) {
    createBuilding(-10.3, z, -1);
    createBuilding(10.3, z, 1);

    if (Math.random() > 0.3) createTree(-7.5, z - 5);
    if (Math.random() > 0.3) createTree(7.5, z - 2);
  }

  createPlayer();
}

function startGame() {
  if (renderer) {
    renderer.domElement.remove();
    renderer.dispose();
  }

  obstacles = [];
  cashItems = [];
  buildings = [];
  roadMarks = [];

  score = 0;
  lives = 3;
  lane = 1;
  speed = 12;
  spawnTimer = 1;
  cashTimer = 1.5;
  invincible = 0;
  lastTime = 0;

  document.getElementById("score").textContent = "০";
  document.getElementById("lives").textContent = "❤️❤️❤️";
  document.getElementById("landing").classList.add("hidden");
  document.getElementById("gameover").classList.add("hidden");
  document.getElementById("hud").classList.remove("hidden");

  initGame();
  running = true;
  requestAnimationFrame(animate);
}

function movePlayer(direction) {
  if (!running) return;
  lane = Math.max(0, Math.min(2, lane + direction));
}

function collectCash() {
  if (!running) return;
  score += 25;
  document.getElementById("score").textContent =
    score.toLocaleString("bn-BD");
  document.getElementById("message").textContent = "বোনাস +২৫৳!";
}

function endGame() {
  running = false;
  document.getElementById("hud").classList.add("hidden");
  document.getElementById("finalScore").textContent =
    score.toLocaleString("bn-BD") + "৳";
  document.getElementById("gameover").classList.remove("hidden");
}

function animate(time) {
  if (!running) return;
  requestAnimationFrame(animate);

  const dt = Math.min((time - lastTime) / 1000 || 0.016, 0.04);
  lastTime = time;

  speed = Math.min(21, speed + dt * 0.1);
  invincible = Math.max(0, invincible - dt);

  player.position.x += (lanes[lane] - player.position.x) * dt * 10;

  camera.position.x += (player.position.x * 0.2 - camera.position.x) * dt * 2;
  camera.lookAt(player.position.x * 0.15, 1, -3);

  for (const mark of roadMarks) {
    mark.position.z += speed * dt;
    if (mark.position.z > 20) mark.position.z -= 155;
  }

  for (const building of buildings) {
    building.position.z += speed * dt * 0.65;
    if (building.position.z > 25) building.position.z -= 150;
  }

  spawnTimer -= dt;
  cashTimer -= dt;

  if (spawnTimer <= 0) {
    createCar(-100, Math.floor(Math.random() * 3));
    spawnTimer = 1.3 + Math.random() * 0.8;
  }

  if (cashTimer <= 0) {
    createCash(-75 - Math.random() * 20, Math.floor(Math.random() * 3));
    cashTimer = 1.2 + Math.random();
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const car = obstacles[i];
    car.position.z += speed * dt;

    if (
      Math.abs(car.position.z - player.position.z) < 1.6 &&
      Math.abs(car.position.x - player.position.x) < 1.3 &&
      !car.userData.hit
    ) {
      car.userData.hit = true;

      if (invincible <= 0) {
        lives--;
        invincible = 1.2;

        document.getElementById("lives").textContent =
          "❤️".repeat(Math.max(0, lives)) +
          "🖤".repeat(3 - Math.max(0, lives));

        document.getElementById("message").textContent =
          "ধাক্কা লেগেছে! সাবধানে চলুন";

        if (lives <= 0) {
          endGame();
          return;
        }
      }
    }

    if (car.position.z > 22) {
      scene.remove(car);
      obstacles.splice(i, 1);
    }
  }

  for (let i = cashItems.length - 1; i >= 0; i--) {
    const cash = cashItems[i];
    cash.position.z += speed * dt;
    cash.rotation.y += dt * 2;

    if (
      Math.abs(cash.position.z - player.position.z) < 1.5 &&
      Math.abs(cash.position.x - player.position.x) < 1.1
    ) {
      score += 100;

      document.getElementById("score").textContent =
        score.toLocaleString("bn-BD");

      document.getElementById("message").textContent =
        "দারুণ! +১০০৳ সংগ্রহ হয়েছে";

      scene.remove(cash);
      cashItems.splice(i, 1);
      continue;
    }

    if (cash.position.z > 22) {
      scene.remove(cash);
      cashItems.splice(i, 1);
    }
  }

  if (invincible > 0) {
    player.visible = Math.floor(time / 100) % 2 === 0;
  } else {
    player.visible = true;
  }

  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  if (!camera || !renderer) return;

  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

window.addEventListener("keydown", event => {
  if (event.key === "ArrowLeft" || event.key === "a") movePlayer(-1);
  if (event.key === "ArrowRight" || event.key === "d") movePlayer(1);
  if (event.code === "Space") collectCash();
});
</script>
</body>
</html>
