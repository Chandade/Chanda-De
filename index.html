<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>চান্দা দে - Dhaka Chanda Collector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>🛺 চান্দা দে! (ঢাকা এডিশন) 🛺</h1>
        
        <div class="stats-board">
            <span>লোকেশন: <strong id="location-name">ফার্মগেট</strong></span> | 
            <span>চাঁদা: <strong id="score">0</strong> টাকা</span> | 
            <span>লাইফ: <strong id="lives">❤️ ❤️ ❤️</strong></span>
        </div>
        
        <!-- গেমের ক্যানভাস -->
        <canvas id="gameCanvas" width="450" height="650"></canvas>
        
        <div class="instructions">
            <p>⬅️ ➡️ তীর চিহ্ন বা স্ক্রিন ট্যাপ করে ক্যারেক্টার ডানে-বায়ে সরান। গাড়ি ও রিকশায় ক্লিক করে চাঁদা তুলুন!</p>
            <p style="color: #e74c3c; font-weight: bold;">⚠️ সতর্কবাণী: পুলিশ আসলে দ্রুত সরে যান বা লুকিয়ে পড়ুন!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
