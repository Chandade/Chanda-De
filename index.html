<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>চান্দা দে - 3D Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1e272c;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #landing-screen {
            position: absolute;
            width: 100%;
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
        }

        .title-box h1 {
            font-size: 50px;
            color: #f1c40f;
            text-shadow: 3px 3px #c0392b;
            margin-bottom: 0;
        }

        .start-btn {
            background-color: #f1c40f;
            color: #2c3e50;
            font-size: 22px;
            font-weight: bold;
            padding: 12px 35px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        #game-ui {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .top-bar {
            position: absolute;
            top: 10px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px #000;
        }

        .controls-overlay {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: auto;
        }

        .joy-btn, .action-btn {
            background: rgba(0,0,0,0.7);
            color: white;
            border: 2px solid #f1c40f;
            padding: 15px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .action-btn {
            background: #27ae60;
            border-color: #2ecc71;
        }
    </style>
    <!-- Three.js Library for True 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Landing Page -->
    <div id="landing-screen">
        <div class="title-box">
            <h1>চান্দা দে</h1>
            <p>3D Dhaka Edition</p>
        </div>
        <p>রাস্তা কি আপনার বাপের? আগে চাঁদা দেন!</p>
        <button class="start-btn" onclick="startGame()">রাস্তায় নামেন</button>
    </div>

    <!-- Game UI Overlay -->
    <div id="game-ui">
        <div class="top-bar">
            <div>চাঁদা: <span id="score">0</span>৳</div>
            <div id="status">অবস্থা: রাস্তায় সক্রিয়</div>
            <div>লাইফ: <span id="lives">❤️❤️❤️</span></div>
        </div>

        <div class="controls-overlay">
            <button class="joy-btn" onclick="movePlayer(-1)">◀ বামে</button>
            <button class="action-btn" onclick="collectChanda()">💵 চাঁদা তুলুন</button>
            <button class="joy-btn" onclick="movePlayer(1)">ডানে ▶</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let player, gundas = [];
        let score = 0, lives = 3;
        let gameActive = false;

        function startGame() {
            document.getElementById('landing-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            init3D();
        }

        function init3D() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2f3640);

            // Camera Setup (Isometric 3D View)
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 15);
            camera.lookAt(0, 0, 0);

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            // 3D Road
            const roadGeometry = new THREE.PlaneGeometry(10, 50);
            const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x353b48 });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            scene.add(road);

            // 3D Buildings on Sides (Safe Houses / Dhaka Buildings)
            const buildingGeo = new THREE.BoxGeometry(4, 8, 10);
            const buildingMat = new THREE.MeshStandardMaterial({ color: 0xb33939 });
            
            const leftBuilding = new THREE.Mesh(buildingGeo, buildingMat);
            leftBuilding.position.set(-7, 4, 0);
            scene.add(leftBuilding);

            const rightBuilding = new THREE.Mesh(buildingGeo, buildingMat);
            rightBuilding.position.set(7, 4, 0);
            scene.add(rightBuilding);

            // 3D Player Character (Chandabaz)
            const playerGeo = new THREE.BoxGeometry(1.2, 1.8, 1.2);
            const playerMat = new THREE.MeshStandardMaterial({ color: 0xe84118 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(0, 1, 4);
            scene.add(player);

            gameActive = true;
            animate();
        }

        function movePlayer(direction) {
            if (player) {
                player.position.x += direction * 1.5;
                if (player.position.x < -3.5) player.position.x = -3.5;
                if (player.position.x > 3.5) player.position.x = 3.5;
            }
        }

        function collectChanda() {
            score += 100;
            document.getElementById("score").innerText = score;
        }

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
